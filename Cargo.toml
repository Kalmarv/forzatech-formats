[package]
name = "forzatech-formats"
description = "Read ForzaTech (Forza Horizon 6) files: the encrypted container its game database, settings archives and saves are wrapped in, with checked reads that never panic on untrusted bytes"
keywords = ["forza", "forzatech", "gamedev", "file-format"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/forzatech-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
primase-testdata.workspace = true

[dependencies]
primase-foundations.workspace = true
thiserror.workspace = true
aes.workspace = true
cmac.workspace = true
hkdf.workspace = true
sha2.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/forzatech-formats"
publish = true

[workspace.dependencies]
primase-foundations = { version = "0.3.0", git = "https://github.com/Kalmarv/primase-foundations", rev = "f9cf4ece1de77fce9d703c63347dd70b728b7c0e" }
primase-testdata = { version = "0.1.6", git = "https://github.com/Kalmarv/primase-testdata", rev = "40acdd6a2775412cc812f67e5b3edfdc9b76c54c" }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
aes = { version = "=0.9.3", default-features = false }
cmac = { version = "=0.8.0", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
